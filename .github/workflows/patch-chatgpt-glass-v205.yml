name: Patch ChatGPT Glass Theme v2.0.5 stacking
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v205.py"
      - ".github/workflows/patch-chatgpt-glass-v205.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v205.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.5" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify body glass rail
        run: |
          grep -q "body::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "z-index: 0" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify app above glass
        run: |
          grep -q "body > :not(script):not(style):not(link)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "z-index: 2" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify center frost
        run: |
          grep -q "blur(22px) saturate(122%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing UHD rotation
        run: |
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Fix ChatGPT glass rail stacking in v2.0.5"
          git push origin HEAD:main
