name: Patch ChatGPT Glass Theme v2.0.2 readability
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v202.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v202.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.2" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify stronger conversation frost
        run: |
          grep -q "blur(16px) saturate(126%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify lighter sidebar glass
        run: |
          grep -q "rgba(27, 43, 58, 0.42)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify sidebar blur budget
        run: |
          grep -q "blur(18px) saturate(126%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve paint-only nested messages
        run: |
          grep -q "backdrop-filter: none" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing UHD rotation
        run: |
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Update ChatGPT glass theme to v2.0.2 readability pass"
          git push origin HEAD:main
