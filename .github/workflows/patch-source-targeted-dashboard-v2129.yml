name: Patch Full UI Theme v2.1.29 source-targeted Dashboard
on:
  push:
    paths:
      - "scripts/patch_source_targeted_dashboard_v2129.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_source_targeted_dashboard_v2129.py
      - run: grep -q "@version      2.1.29" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "#widget-tasks" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "#widget-designs" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "#widget-estimates" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "#page-content .panel-body.bg-light" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "blur(20px) saturate(138%)" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "v2.1.26 TOPBAR GEOMETRY REPAIR" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "Theme was not changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Fix main Dashboard true frost from source DOM v2.1.29"
          git push
