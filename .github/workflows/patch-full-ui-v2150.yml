name: Patch Full UI v2.1.50
on:
  push:
    paths:
      - "scripts/patch_full_ui_v2150.py"
      - ".github/workflows/patch-full-ui-v2150.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dark mode patch
        run: python scripts/patch_full_ui_v2150.py
      - name: Verify
        run: |
          grep -q '@version      2.1.50' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'v2.1.50 DARK MODE' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q -- '--us-bg: rgba(3, 8, 14, 0.82)' tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme-v2.1.50.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Full-UI-Theme-v2.1.50.user.js
          git commit -m "Transform Full UI into dark mode v2.1.50"
          git pull --rebase origin main
          git push origin main
