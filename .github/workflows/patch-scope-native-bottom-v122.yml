name: Patch Scope native bottom v1.2.2
on:
  push:
    paths:
      - "scripts/patch_scope_native_bottom_v122.py"
      - ".github/workflows/patch-scope-native-bottom-v122.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_scope_native_bottom_v122.py
      - name: Verify
        run: |
          grep -Fq "@version      1.2.2" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -Fq "v1.2.2 LIVE SCOPE PANEL REPAIR" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -Fq "grid-template-areas:\"title controls\" \"form form\"" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -Fq "backdrop-filter:blur(12px) saturate(128%)" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -Fq "grid-template-columns:auto minmax(0,1fr) auto" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
      - name: Syntax
        run: node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
      - name: Diff
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          git commit -m "Repair native Scope editor panel"
          git push origin HEAD:main
