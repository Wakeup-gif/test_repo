name: Patch Project Scope v1.2.3
on:
  push:
    paths:
      - "scripts/patch_project_scope_v123.py"
      - ".github/workflows/patch-project-scope-v123.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Project Scope v1.2.3
        run: python scripts/patch_project_scope_v123.py
      - name: Verify
        run: |
          grep -q '@version      1.2.3' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q 'v1.2.3 SCOPE WINDOW ALIGNMENT + TRUE GLASS' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q 'us-sign-scope-frame-glass-v123' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q 'US-Sign-Project-Scope-Workspace-v1.2.3.user.js' <(find tampermonkey -maxdepth 1 -type f -printf '%f\n')
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.3.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Project-Scope-Workspace.user.js tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.3.user.js
          git commit -m "Repair Scope window glass v1.2.3"
          git push origin main