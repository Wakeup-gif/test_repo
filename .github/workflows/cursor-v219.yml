name: Cursor v2.1.19
on:
  push:
    paths:
      - "scripts/cursor_v219_patch.py"
      - ".github/workflows/cursor-v219.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/cursor_v219_patch.py
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Refine cursor to luxe glass v2.1.19"
          git push
