name: Patch ChatGPT cursor v2.1.1

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_chatgpt_cursor_v211.py
      - .github/workflows/patch-chatgpt-cursor-v211.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cursor
        run: python scripts/patch_chatgpt_cursor_v211.py

      - name: Validate
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          node --check tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.1.user.js
          grep -F '// @version      2.1.1' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -F 'width%3D%2226%22' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -F 'width%3D%2232%22' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          cmp tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.1.user.js
          git diff --check

      - name: Commit
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.1.user.js; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.1.user.js
          git commit -m 'Fix and enlarge ChatGPT Dark Glass cursor'
          git push origin HEAD:main
