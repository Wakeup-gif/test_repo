name: Patch Full UI Theme v2.1.23 dashboard glass and cursor
on:
  push:
    paths:
      - "scripts/patch_dashboard_glass_cursor_v2123.py"
      - ".github/workflows/patch-dashboard-glass-cursor-v2123.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_dashboard_glass_cursor_v2123.py
      - run: grep -q "@version      2.1.23" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "v2.1.23 JOB DASHBOARD GLASS SYSTEM" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "us-sign-cursor-cutout-v2123.svg" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "us-sign-cursor-cutout-hover-v2123.svg" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Unify Job Dashboard glass and finish cursor v2.1.23"
          git push
