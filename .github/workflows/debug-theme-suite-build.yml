name: Debug theme suite build
on:
  push:
    paths:
      - ".github/workflows/debug-theme-suite-build.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture builder and validation results
        shell: bash
        run: |
          set +e
          {
            echo "=== builder ==="
            python scripts/build_theme_aware_suites_v101.py
            echo "builder_rc=$?"
            echo "=== expected markers ==="
            checks=(
              "grep -q '@version      1.0.1' tampermonkey/US-Sign-Dark-Glass-Theme.user.js"
              "grep -q 'us-sign-theme-dark-glass' tampermonkey/US-Sign-Dark-Glass-Theme.user.js"
              "grep -q '@version      4.1.5' tampermonkey/US-Sign-Design-Job-Tools.user.js"
              "grep -q '@version      1.2.5' tampermonkey/US-Sign-Project-Scope-Workspace.user.js"
              "grep -q '@version      2.3.1' tampermonkey/US-Sign-Description-File-Path-Tools.user.js"
              "grep -q '@version      2.6.1' tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js"
              "grep -q '@version      3.1.4' tampermonkey/US-Sign-UI-Runtime-Fixes.user.js"
              "test -s packages/US-Sign-Glass-Suite-v1.0.0.zip"
              "test -s packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip"
            )
            for cmd in "${checks[@]}"; do
              bash -lc "$cmd"
              echo "rc=$? :: $cmd"
            done
            echo "=== node syntax ==="
            for f in \
              tampermonkey/US-Sign-Dark-Glass-Theme.user.js \
              tampermonkey/US-Sign-Design-Job-Tools.user.js \
              tampermonkey/US-Sign-Project-Scope-Workspace.user.js \
              tampermonkey/US-Sign-Menu-Cleanup.user.js \
              tampermonkey/US-Sign-Description-File-Path-Tools.user.js \
              tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js \
              tampermonkey/US-Sign-UI-Runtime-Fixes.user.js; do
              node --check "$f"
              echo "rc=$? :: node --check $f"
            done
            echo "=== zip tests ==="
            unzip -t packages/US-Sign-Glass-Suite-v1.0.0.zip
            echo "glass_zip_rc=$?"
            unzip -t packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip
            echo "dark_zip_rc=$?"
            echo "=== diff check ==="
            git diff --check
            echo "diff_rc=$?"
            echo "=== git status ==="
            git status --short
          } > /tmp/theme-suite-debug.txt 2>&1
      - name: Commit diagnostic only
        run: |
          git reset --hard HEAD
          git clean -fd
          cp /tmp/theme-suite-debug.txt theme-suite-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-suite-debug.txt
          git commit -m "Capture full theme suite validation diagnostic"
          git pull --rebase origin main
          git push origin main
