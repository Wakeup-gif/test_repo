name: Patch ChatGPT Glass Theme v2.0.18 guard repair
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v218.py"
      - ".github/workflows/patch-chatgpt-glass-v218.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.0.18 guard repair
        run: python scripts/patch_chatgpt_glass_v218.py

      - name: Verify version and guard
        run: |
          grep -Fq "@version      2.0.18" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "if (window.__chatgptUsSignGlassThemeV218) return;" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "window.__chatgptUsSignGlassThemeV218 = true;" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "window.__chatgptUsSignGlassThemeV216 = true;" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve v2.0.17 fixes
        run: |
          grep -Fq "linear-gradient(90deg, transparent 0%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "blur(9px) saturate(116%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "function resolveWallpaperRule()" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "rule.style.setProperty(\"transform\", transform, \"important\")" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const ROTATE_MS = 30 * 60 * 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Syntax check
        run: node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Repair ChatGPT theme release guard in v2.0.18"
          git push origin HEAD:main
