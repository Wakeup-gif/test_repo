name: Patch ChatGPT Glass Theme v2.0.4 stacking
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v204.py"
      - ".github/workflows/patch-chatgpt-glass-v204.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v204.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.4" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify behind-content frost
        run: |
          grep -q "main::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "z-index: -1" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify runtime no overlay node
        run: |
          ! grep -q 'createElement("div")' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js || true
          ! grep -q 'us-chatgpt-center-glass' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve center blur
        run: |
          grep -q "blur(22px) saturate(124%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve sidebar glass
        run: |
          grep -q "rgba(25, 40, 55, 0.20)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing UHD rotation
        run: |
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Fix ChatGPT glass rail stacking in v2.0.4"
          git push origin HEAD:main
