name: Patch Status native structure v2.1.33 / v1.2.1
on:
  push:
    paths:
      - "scripts/patch_status_native_structure_v2133_v121.py"
      - ".github/workflows/patch-status-native-structure-v2133-v121.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply status native-structure patch
        run: python scripts/patch_status_native_structure_v2133_v121.py

      - name: Verify versions
        run: |
          grep -Fq "@version      2.1.33" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "@version      1.2.1" tampermonkey/US-Sign-Project-Scope-Workspace.user.js

      - name: Verify Status page scoping
        run: |
          grep -Fq "us-sign-project-status-page" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "project_milestones\\.php" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "if (/\\/project_milestones\\.php$/i.test(location.pathname)) return;" tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -Fq "const isStatus = usSignIsProjectStatusPage" tampermonkey/US-Sign-Full-UI-Theme.user.js

      - name: Verify native split-pane preservation
        run: |
          grep -Fq "#content .tray-center > .pl15.pr15 > .tab-block" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq ".tab-block > .tabs-left" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq ".tab-block > .tab-content" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq ".tabs-left > li > a.active-tab" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "padding: 12px 16px !important" tampermonkey/US-Sign-Full-UI-Theme.user.js

      - name: Verify compact controls and notes
        run: |
          grep -Fq "padding: 1px 5px !important" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "padding: 5px 10px !important" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "height: 76px !important" tampermonkey/US-Sign-Full-UI-Theme.user.js

      - name: Syntax checks
        run: |
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical updates
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Project-Scope-Workspace.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          git commit -m "Respect native Project Status structure"
          git push origin HEAD:main
