name: Patch Clock Out glass v2.1.36
on:
  push:
    paths:
      - "scripts/patch_clockout_glass_v2136.py"
      - ".github/workflows/patch-clockout-glass-v2136.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Clock Out glass patch
        run: python scripts/patch_clockout_glass_v2136.py
      - name: Verify Clock Out glass
        run: |
          grep -Fq "@version      2.1.36" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "backdrop-filter: blur(8px) saturate(92%) brightness(0.78)" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "backdrop-filter: blur(22px) saturate(142%) brightness(0.97)" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "background: rgba(3, 8, 14, 0.32)" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Add full glass Clock Out modal"
          git pull --rebase origin main
          git push origin HEAD:main
