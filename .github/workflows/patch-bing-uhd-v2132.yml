name: Patch Full UI Theme v2.1.32 Bing UHD quality
on:
  push:
    paths:
      - "scripts/patch_bing_uhd_v2132.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_bing_uhd_v2132.py
      - name: Verify version
        run: grep -q "@version      2.1.32" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify UHD request
        run: grep -q "uhd=1&uhdwidth=3840&uhdheight=2160" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify cache reset
        run: grep -q "us-sign-bing-wallpaper-pool-v2" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify reduced overscan
        run: |
          grep -q "106vw auto" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q "auto 106vh" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Preserve rotation
        run: grep -q "US_SIGN_BING_ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Update Full UI Theme to v2.1.32 Bing UHD quality"
          git push origin HEAD:main
