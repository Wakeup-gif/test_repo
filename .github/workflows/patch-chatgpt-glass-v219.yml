name: Patch ChatGPT Glass Theme v2.0.19 gaussian/parallax
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v219.py"
      - ".github/workflows/patch-chatgpt-glass-v219.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.0.19 patch
        run: python scripts/patch_chatgpt_glass_v219.py

      - name: Verify version and guard
        run: |
          grep -Fq "@version      2.0.19" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "if (window.__chatgptUsSignGlassThemeV219) return;" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "window.__chatgptUsSignGlassThemeV219 = true;" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify cached Gaussian center glass
        run: |
          grep -Fq "var(--us-wallpaper) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "filter: blur(14px) saturate(114%) brightness(0.92) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "height: calc(100dvh + 56px) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "top: -28px !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "backdrop-filter: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify persistent blur removal
        run: |
          grep -Fq "background: rgba(22, 38, 53, 0.64) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "background: rgba(20, 34, 48, 0.74) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "background: rgba(15, 28, 40, 0.80) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "blur(14px) saturate(116%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "blur(14px) saturate(120%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "blur(12px) saturate(118%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify smooth parallax
        run: |
          grep -Fq "const PARALLAX_X_PX = 6" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const PARALLAX_Y_PX = 4" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "event.getCoalescedEvents" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "lastPointerX" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "lastPointerY" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "rule.style.setProperty(\"transform\", transform, \"important\")" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "transition: transform 170ms" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve click and rotation safety
        run: |
          grep -Fq "pointer-events: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const ROTATE_MS = 30 * 60 * 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "threadRailObserver" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Syntax check
        run: node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Use cached Gaussian glass and smooth parallax in v2.0.19"
          git push origin HEAD:main
