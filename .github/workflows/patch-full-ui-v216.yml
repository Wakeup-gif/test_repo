name: Patch UI Runtime
on:
  push:
    paths:
      - "scripts/patch_ui_runtime_v311.tmp"
      - ".github/workflows/patch-full-ui-v216.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_ui_runtime_v311.tmp
      - run: node --check tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-UI-Runtime-Fixes.user.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          git commit -m "Remove CKEditor tan mark highlight v3.1.1"
          git push