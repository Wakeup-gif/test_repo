name: Patch Full UI wallpaper visibility v2.0.1

on:
  push:
    paths:
      - "scripts/patch_full_ui_wallpaper_visibility_v201.py"
      - ".github/workflows/patch-full-ui-wallpaper-visibility-v201.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Full UI Theme
        run: python scripts/patch_full_ui_wallpaper_visibility_v201.py
      - name: Validate JavaScript syntax
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Check diff
        run: git diff --check
      - name: Commit updated theme
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Fix SquareCoil wallpaper visibility v2.0.1"
          git push
