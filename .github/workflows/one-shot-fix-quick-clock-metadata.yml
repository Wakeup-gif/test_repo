name: One-shot fix Quick Clock metadata

on:
  push:
    branches:
      - utility/squarecoil-quick-clock-v0.3.0
    paths:
      - .github/workflows/one-shot-fix-quick-clock-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct test-branch update URLs
        shell: bash
        run: |
          set -euo pipefail
          file=tampermonkey/US-Sign-SquareCoil-Quick-Clock.user.js
          old='https://github.com/Wakeup-gif/test_repo/raw/refs/heads/utility/squarecoil-quick-clock-v0.3.0/tampermonkey/US-Sign-SquareCoil-Quick-Clock.user.js'
          new='https://raw.githubusercontent.com/Wakeup-gif/test_repo/utility/squarecoil-quick-clock-v0.3.0/tampermonkey/US-Sign-SquareCoil-Quick-Clock.user.js'
          python - "$file" "$old" "$new" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          old, new = sys.argv[2], sys.argv[3]
          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Expected old metadata URL was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$file"
          git commit -m 'fix(quick-clock): correct test update URLs'
          git push
