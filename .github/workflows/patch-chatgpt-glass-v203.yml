name: Patch ChatGPT Glass Theme v2.0.3 real glass
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v203.py"
      - ".github/workflows/patch-chatgpt-glass-v203.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v203.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.3" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify dedicated center rail
        run: |
          grep -q "#us-chatgpt-center-glass" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "blur(22px) saturate(124%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify translucent sidebar
        run: |
          grep -q "rgba(25, 40, 55, 0.20)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "rgba(34, 52, 70, 0.075)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify old turn-list blur disabled
        run: |
          grep -q "ChatGPT changes the conversation list wrapper frequently" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify center rail runtime mount
        run: |
          grep -q "mountCenterGlassRail" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q -- "--us-chat-sidebar-edge" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing UHD rotation
        run: |
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Update ChatGPT glass theme to v2.0.3 real glass pass"
          git push origin HEAD:main
