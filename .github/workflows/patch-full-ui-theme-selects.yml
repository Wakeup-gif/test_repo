name: Patch Full UI Theme selects

on:
  push:
    paths:
      - "scripts/patch_full_ui_theme_selects.py"
      - ".github/workflows/patch-full-ui-theme-selects.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Existing Projects select styling
        run: python scripts/patch_full_ui_theme_selects.py

      - name: Validate JavaScript syntax
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js

      - name: Check diff
        run: git diff --check

      - name: Commit Full UI Theme update
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No Full UI Theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Fix Existing Projects dropdown styling v1.1.1"
          git push
