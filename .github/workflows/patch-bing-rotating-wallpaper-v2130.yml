name: Patch Full UI Theme v2.1.30 Bing wallpaper rotation
on:
  push:
    paths:
      - "scripts/patch_bing_rotating_wallpaper_v2130.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_bing_rotating_wallpaper_v2130.py
      - name: Verify version
        run: grep -q "@version      2.1.30" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify Bing grant
        run: grep -q "@grant        GM_xmlhttpRequest" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify Bing connect
        run: grep -q "@connect      www.bing.com" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify 30 minute rotation
        run: grep -q "US_SIGN_BING_ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify Bing endpoint
        run: grep -q "HPImageArchive.aspx?format=js&idx=0&n=8" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify four markets
        run: grep -q "'en-US', 'en-GB', 'en-AU', 'ja-JP'" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify wallpaper CSS variable update
        run: grep -q "style.setProperty('--us-wallpaper'" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Update Full UI Theme to v2.1.30 Bing wallpaper rotation"
          git push
