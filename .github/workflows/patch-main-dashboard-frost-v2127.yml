name: Patch Full UI Theme v2.1.27 main Dashboard frost
on:
  push:
    paths:
      - "scripts/patch_main_dashboard_frost_v2127.py"
      - ".github/workflows/patch-main-dashboard-frost-v2127.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_main_dashboard_frost_v2127.py
      - run: grep -q "@version      2.1.27" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "v2.1.27 MAIN DASHBOARD TRUE FROST" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "us-sign-main-dashboard" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "blur(22px) saturate(145%)" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "blur(16px) saturate(132%)" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: grep -q "v2.1.26 TOPBAR GEOMETRY REPAIR" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Add true frost to main Dashboard in Full UI v2.1.27"
          git push
