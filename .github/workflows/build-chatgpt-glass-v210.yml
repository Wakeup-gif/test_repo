name: Build ChatGPT Clear and Dark Glass

on:
  push:
    branches:
      - main
    paths:
      - scripts/build_chatgpt_glass_themes_v210.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build themes
        run: python scripts/build_chatgpt_glass_themes_v210.py

      - name: Validate userscripts
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js
          node --check tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme-v2.0.20.user.js
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          node --check tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.0.user.js
          cmp tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme-v2.0.20.user.js
          cmp tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.0.user.js
          grep -F '// @name         ChatGPT - US Sign Clear Glass Theme' tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js
          grep -F '// @version      2.0.20' tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js
          grep -F '// @name         ChatGPT - US Sign Dark Glass Theme' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -F '// @version      2.1.0' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git diff --check

      - name: Commit themes
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme-v2.0.20.user.js tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.0.user.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Clear-Glass-Theme-v2.0.20.user.js tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js tampermonkey/ChatGPT-US-Sign-Dark-Glass-Theme-v2.1.0.user.js
          git commit -m 'Add ChatGPT Clear and Dark Glass themes'
          git push origin HEAD:main
