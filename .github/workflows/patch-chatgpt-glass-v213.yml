name: Patch ChatGPT Glass Theme v2.0.13 snapshot thread glass
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v213.py"
      - ".github/workflows/patch-chatgpt-glass-v213.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v213.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.13" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify snapshot-grounded thread glass
        run: |
          grep -q "#thread::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "isolation: isolate !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "blur(20px) saturate(126%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "rgba(10, 23, 36, 0.50)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify discovery observer removed
        run: |
          ! grep -q "function findThreadRoot" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -q "threadRailObserver" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve click and header safety
        run: |
          ! grep -q "body::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -q "main::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "header {" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing rotation
        run: |
          grep -q "const ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Use snapshot-grounded #thread glass in v2.0.13"
          git push origin HEAD:main
