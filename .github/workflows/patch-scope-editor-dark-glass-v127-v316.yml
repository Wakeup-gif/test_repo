name: Patch Scope editor Dark Glass v1.2.7 + v3.1.6
on:
  push:
    paths:
      - "scripts/patch_scope_editor_dark_glass_v127_v316.py"
      - ".github/workflows/patch-scope-editor-dark-glass-v127-v316.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Scope editor Dark Glass patch
        run: python scripts/patch_scope_editor_dark_glass_v127_v316.py
      - name: Validate userscripts
        run: |
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          node --check tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.7.user.js
          node --check tampermonkey/US-Sign-UI-Runtime-Fixes-v3.1.6.user.js
          grep -q '@version      1.2.7' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q '@version      3.1.6' tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          grep -q 'SCOPE PAGE DARK GLASS CANVAS' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q 'iframe.cke_wysiwyg_frame' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q '__usSignUiRuntimeV316' tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          git diff --check
      - name: Commit canonical and fresh installers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tampermonkey/US-Sign-Project-Scope-Workspace.user.js \
            tampermonkey/US-Sign-UI-Runtime-Fixes.user.js \
            tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.7.user.js \
            tampermonkey/US-Sign-UI-Runtime-Fixes-v3.1.6.user.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Darken Scope editor glass canvas"
            git push origin main
          fi
