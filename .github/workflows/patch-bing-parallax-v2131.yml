name: Patch Full UI Theme v2.1.31 Bing parallax

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_bing_parallax_v2131.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_bing_parallax_v2131.py
      - name: Verify version
        run: grep -q "@version      2.1.31" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify parallax CSS
        run: grep -q "v2.1.31 BING WALLPAPER PARALLAX" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify overscan
        run: grep -q "110vw auto" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify pointer listener
        run: grep -q "pointermove" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify RAF throttling
        run: grep -q "requestAnimationFrame(usSignRenderParallax)" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Verify reduced motion
        run: |
          grep -q "prefers-reduced-motion: no-preference" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Preserve Bing rotation
        run: grep -q "US_SIGN_BING_ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Update Full UI Theme to v2.1.31 Bing parallax"
          git push origin HEAD:main
