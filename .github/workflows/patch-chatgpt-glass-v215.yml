name: Patch ChatGPT Glass Theme v2.0.15 tapered panel
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v215.py"
      - ".github/workflows/patch-chatgpt-glass-v215.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tapered panel patch
        run: python scripts/patch_chatgpt_glass_v215.py

      - name: Verify version
        run: grep -Fq "@version      2.0.15" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify top anchored glass
        run: |
          grep -Fq "top: 0 !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "width: min(1000px, calc(100% - 32px)) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "height: calc(100dvh - 92px) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify tapered edges
        run: |
          grep -Fq "radial-gradient(ellipse 55% 125% at 50% 0%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "border-radius: 0 0 32px 32px !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve performance architecture
        run: |
          grep -Fq "position: sticky !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "threadRailObserver" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "function renderParallax" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve Bing rotation
        run: |
          grep -Fq "const ROTATE_MS = 30 * 60 * 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Syntax check
        run: node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Extend and taper ChatGPT reading glass in v2.0.15"
          git push origin HEAD:main
