name: Build theme-aware Glass and Dark suites v1.0.1
on:
  push:
    paths:
      - "scripts/build_theme_aware_suites_v101.py"
      - ".github/workflows/build-theme-aware-suites-v101.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build companion bridges and packages
        run: python scripts/build_theme_aware_suites_v101.py
      - name: Validate userscripts and packages
        run: |
          grep -q '@version      1.0.1' tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          grep -q 'us-sign-theme-dark-glass' tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          grep -q '@version      4.1.5' tampermonkey/US-Sign-Design-Job-Tools.user.js
          grep -q '@version      1.2.5' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q '@version      2.3.1' tampermonkey/US-Sign-Description-File-Path-Tools.user.js
          grep -q '@version      2.6.1' tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js
          grep -q '@version      3.1.4' tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          test -s packages/US-Sign-Glass-Suite-v1.0.0.zip
          test -s packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip
          node --check tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          node --check tampermonkey/US-Sign-Design-Job-Tools.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          node --check tampermonkey/US-Sign-Menu-Cleanup.user.js
          node --check tampermonkey/US-Sign-Description-File-Path-Tools.user.js
          node --check tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js
          node --check tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          unzip -t packages/US-Sign-Glass-Suite-v1.0.0.zip
          unzip -t packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip
          git diff --check
      - name: Commit suite split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Dark-Glass-Theme.user.js \
                  tampermonkey/US-Sign-Dark-Glass-Theme-v1.0.1.user.js \
                  tampermonkey/US-Sign-Design-Job-Tools.user.js \
                  tampermonkey/US-Sign-Design-Job-Tools-v4.1.5.user.js \
                  tampermonkey/US-Sign-Project-Scope-Workspace.user.js \
                  tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.5.user.js \
                  tampermonkey/US-Sign-Description-File-Path-Tools.user.js \
                  tampermonkey/US-Sign-Description-File-Path-Tools-v2.3.1.user.js \
                  tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js \
                  tampermonkey/US-Sign-Scope-of-Work-File-Tools-v2.6.1.user.js \
                  tampermonkey/US-Sign-UI-Runtime-Fixes.user.js \
                  tampermonkey/US-Sign-UI-Runtime-Fixes-v3.1.4.user.js \
                  packages/US-Sign-Glass-Suite-v1.0.0.zip \
                  packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip
          git commit -m "Add theme-aware companion scripts and suite packages"
          git pull --rebase origin main
          git push origin main
