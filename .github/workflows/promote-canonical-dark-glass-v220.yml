name: Promote canonical Dark Glass v2.2.0
on:
  push:
    paths:
      - "scripts/promote_dark_glass_canonical_v220.py"
      - ".github/workflows/promote-canonical-dark-glass-v220.yml"
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote canonical scripts and archive Glass era
        run: python scripts/promote_dark_glass_canonical_v220.py
      - name: Validate canonical Tampermonkey update surface
        run: |
          grep -q '@name         US Sign Full UI Theme' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q '@version      2.2.0' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'US-Sign-Full-UI-Theme.user.js' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'us-sign-theme-dark-glass' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q '@version      4.1.5' tampermonkey/US-Sign-Design-Job-Tools.user.js
          grep -q '@version      1.2.5' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q '@version      3.0.2' tampermonkey/US-Sign-Menu-Cleanup.user.js
          grep -q '@version      2.3.1' tampermonkey/US-Sign-Description-File-Path-Tools.user.js
          grep -q '@version      2.6.1' tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js
          grep -q '@version      3.1.4' tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          test -s tampermonkey/archive/glass-era-final/US-Sign-Glass-Theme-v1.0.0.user.js
          test -s tampermonkey/archive/glass-era-final/US-Sign-Design-Job-Tools-v4.1.4.user.js
          test ! -e packages/US-Sign-Glass-Suite-v1.0.0.zip
          test ! -e packages/US-Sign-Dark-Glass-Suite-v1.0.1.zip
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Design-Job-Tools.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          node --check tampermonkey/US-Sign-Menu-Cleanup.user.js
          node --check tampermonkey/US-Sign-Description-File-Path-Tools.user.js
          node --check tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js
          node --check tampermonkey/US-Sign-UI-Runtime-Fixes.user.js
          git diff --check
      - name: Commit canonical Dark Glass update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tampermonkey packages
          git commit -m "Promote canonical Tampermonkey scripts to Dark Glass"
          git pull --rebase origin main
          git push origin main
