name: Patch Full UI Theme v2.1.22 triangle cursor
on:
  push:
    paths:
      - "scripts/patch_triangle_cursor_v2122.py"
      - ".github/workflows/patch-triangle-cursor-v2122.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_triangle_cursor_v2122.py
      - run: test -f tampermonkey/assets/us-sign-cursor-triangle-v2122.svg
      - run: test -f tampermonkey/assets/us-sign-cursor-triangle-hover-v2122.svg
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Use outline-free dynamic triangle cursor v2.1.22"
          git push
