name: Patch ChatGPT Glass Theme v2.0.17 panel/parallax
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v217.py"
      - ".github/workflows/patch-chatgpt-glass-v217.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.0.17 patch
        run: python scripts/patch_chatgpt_glass_v217.py

      - name: Verify version
        run: grep -Fq "@version      2.0.17" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify continuous bottom glass
        run: |
          grep -Fq "linear-gradient(90deg, transparent 0%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "background: rgba(10, 23, 36, 0.69) !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "blur(9px) saturate(116%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "ellipse 58% 101% at 50% -1%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify footer blend
        run: grep -Fq "rgba(10, 23, 36, 0.30) 100%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify direct-rule parallax
        run: |
          grep -Fq "const themeStyle = GM_addStyle" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "function resolveWallpaperRule()" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "rule.style.setProperty(\"transform\", transform, \"important\")" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const PARALLAX_X_PX = 9" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const PARALLAX_Y_PX = 5" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "function renderParallax" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve click and performance safety
        run: |
          grep -Fq "pointer-events: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "threadRailObserver" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "transition: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve Bing rotation
        run: |
          grep -Fq "const ROTATE_MS = 30 * 60 * 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Syntax check
        run: node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Blend ChatGPT footer glass and optimize parallax in v2.0.17"
          git push origin HEAD:main
