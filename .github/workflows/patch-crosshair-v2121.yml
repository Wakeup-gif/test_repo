name: Patch Full UI Theme v2.1.21 crosshair
on:
  push:
    paths:
      - "scripts/patch_crosshair_v2121.py"
      - ".github/workflows/patch-crosshair-v2121.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_crosshair_v2121.py
      - run: test -f tampermonkey/assets/us-sign-cursor-crosshair-v2121.svg
      - run: test -f tampermonkey/assets/us-sign-cursor-crosshair-hover-v2121.svg
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Add dynamic crosshair cursor v2.1.21"
          git push
