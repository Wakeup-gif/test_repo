name: Patch Full UI v2.1.43
on:
  push:
    paths:
      - "scripts/patch_full_ui_v2143.py"
      - ".github/workflows/patch-full-ui-v2143.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Full UI v2.1.43
        run: python scripts/patch_full_ui_v2143.py
      - name: Verify
        run: |
          grep -q '@version      2.1.43' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'v2.1.43 LEFT SIDEBAR WALLPAPER-VISIBLE GLASS + ALIGNMENT' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'background-color: rgba(5, 18, 30, 0.10)' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'US-Sign-Full-UI-Theme-v2.1.43.user.js' <(find tampermonkey -maxdepth 1 -type f -printf '%f\n')
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme-v2.1.43.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Full-UI-Theme-v2.1.43.user.js
          git commit -m "Reveal wallpaper through sidebar glass v2.1.43"
          git pull --rebase origin main
          git push origin main
