name: Patch Clock Out modal v2.1.35
on:
  push:
    paths:
      - "scripts/patch_clockout_modal_v2135.py"
      - ".github/workflows/patch-clockout-modal-v2135.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Clock Out patch
        run: python scripts/patch_clockout_modal_v2135.py
      - name: Verify Clock Out modal repair
        run: |
          grep -Fq "@version      2.1.35" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "v2.1.35 CLOCK OUT / MATERIAL USED MODAL" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "#modal-overlay.duplicate-modal-2 > .duplicate-modal-content-2" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "grid-template-areas:" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "#clock-cancel-button::before" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "backdrop-filter: blur(18px) saturate(132%)" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "#clock-actions-cancel" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Repair Clock Out material modal"
          git push origin HEAD:main
