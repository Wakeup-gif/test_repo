name: Patch Full UI select wrapper

on:
  push:
    paths:
      - "scripts/patch_full_ui_select_wrapper.py"
      - ".github/workflows/patch-full-ui-select-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Existing Projects select wrapper
        run: python scripts/patch_full_ui_select_wrapper.py

      - name: Validate JavaScript syntax
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js

      - name: Check diff
        run: git diff --check

      - name: Commit theme update
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Fix Existing Projects select wrappers v1.1.2"
          git push
