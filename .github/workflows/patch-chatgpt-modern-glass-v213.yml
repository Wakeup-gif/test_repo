name: Patch ChatGPT Modern Glass v2.1.3

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_chatgpt_modern_glass_v213.py"
      - ".github/workflows/patch-chatgpt-modern-glass-v213.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical userscript
        run: python scripts/patch_chatgpt_modern_glass_v213.py

      - name: Validate userscripts
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme-v2.1.3.user.js
          grep -q '@version      2.1.3' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q -- '--us-frost: blur(18px)' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q 'backdrop-filter: var(--us-frost)' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q 'rgba(0,0,0,0.18)' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git diff --check

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js \
            tampermonkey/ChatGPT-US-Sign-Glass-Theme-v2.1.3.user.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Optimize ChatGPT modern glass theme v2.1.3"
            git push origin main
          fi
