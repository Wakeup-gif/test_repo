name: Patch ChatGPT Glass Theme v2.0.8 click safety
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v208.py"
      - ".github/workflows/patch-chatgpt-glass-v208.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v208.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.8" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify body glass removed
        run: |
          ! grep -q "body::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify main-only glass
        run: |
          grep -q "main::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "z-index: -1" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "pointer-events: none" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve 30 minute Bing rotation
        run: |
          grep -q "const ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Move ChatGPT center glass off body in v2.0.8"
          git push origin HEAD:main
