name: Patch Project Scope v1.2.4
on:
  push:
    paths:
      - "scripts/patch_project_scope_v124.py"
      - ".github/workflows/patch-project-scope-v124.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Project Scope v1.2.4
        run: python scripts/patch_project_scope_v124.py
      - name: Verify
        run: |
          grep -q '@version      1.2.4' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q 'v1.2.4 CKEDITOR FORMATTING TOOLBAR GLASS CONTROLS' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          grep -q '.cke_combo_button' tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          test -f tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.4.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace.user.js
          node --check tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.4.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Project-Scope-Workspace.user.js tampermonkey/US-Sign-Project-Scope-Workspace-v1.2.4.user.js
          git commit -m "Polish Scope formatting toolbar v1.2.4"
          git push origin main
