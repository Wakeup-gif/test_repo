name: Patch ChatGPT Glass Theme v2.0.16 panel/parallax
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v216.py"
      - ".github/workflows/patch-chatgpt-glass-v216.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.0.16 patch
        run: python scripts/patch_chatgpt_glass_v216.py

      - name: Verify version
        run: grep -Fq "@version      2.0.16" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify bottom taper
        run: |
          grep -Fq "height: 100dvh !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "margin-bottom: -100dvh !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "ellipse 58% 101% at 50% -1%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "rgba(0,0,0,0.16) 96%" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Verify immediate parallax
        run: |
          grep -Fq "transition: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const PARALLAX_X_PX = 10" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "const PARALLAX_Y_PX = 6" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "transition: transform 170ms" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "function renderParallax" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve click and performance safety
        run: |
          grep -Fq "pointer-events: none !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          ! grep -Fq "threadRailObserver" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "position: sticky !important" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Preserve Bing rotation
        run: |
          grep -Fq "const ROTATE_MS = 30 * 60 * 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -Fq "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Syntax check
        run: node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js

      - name: Diff check
        run: git diff --check

      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Smooth ChatGPT panel bottom and parallax in v2.0.16"
          git push origin HEAD:main
