name: Split Glass and Dark Glass themes v1
on:
  push:
    paths:
      - "scripts/split_glass_dark_themes_v1.py"
      - ".github/workflows/split-glass-dark-themes-v1.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build themes
        run: python scripts/split_glass_dark_themes_v1.py
      - name: Validate
        run: |
          grep -q '@name         US Sign Glass Theme' tampermonkey/US-Sign-Glass-Theme.user.js
          grep -q '@namespace    us-sign-glass-theme' tampermonkey/US-Sign-Glass-Theme.user.js
          grep -q '@version      1.0.0' tampermonkey/US-Sign-Glass-Theme.user.js
          grep -q '@name         US Sign Dark Glass Theme' tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          grep -q '@namespace    us-sign-dark-glass-theme' tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          grep -q 'DARK GLASS v1.0.0 GRAPHITE + COHESIVE FROST' tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          node --check tampermonkey/US-Sign-Glass-Theme.user.js
          node --check tampermonkey/US-Sign-Dark-Glass-Theme.user.js
          node --check tampermonkey/US-Sign-Glass-Theme-v1.0.0.user.js
          node --check tampermonkey/US-Sign-Dark-Glass-Theme-v1.0.0.user.js
          git diff --check
      - name: Commit themes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Glass-Theme.user.js tampermonkey/US-Sign-Glass-Theme-v1.0.0.user.js tampermonkey/US-Sign-Dark-Glass-Theme.user.js tampermonkey/US-Sign-Dark-Glass-Theme-v1.0.0.user.js
          git commit -m "Split Glass and Dark Glass themes v1.0.0"
          git pull --rebase origin main
          git push origin main
