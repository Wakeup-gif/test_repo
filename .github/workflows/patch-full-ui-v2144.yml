name: Patch Full UI v2.1.44
on:
  push:
    paths:
      - "scripts/patch_full_ui_v2144.py"
      - ".github/workflows/patch-full-ui-v2144.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Full UI v2.1.44
        run: python scripts/patch_full_ui_v2144.py
      - name: Verify
        run: |
          grep -q '@version      2.1.44' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'v2.1.44 SIDEBAR DIRECT WALLPAPER MAPPING' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'var(--us-wallpaper)' tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme-v2.1.44.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Full-UI-Theme-v2.1.44.user.js
          git commit -m "Map live wallpaper directly into sidebar v2.1.44"
          git pull --rebase origin main
          git push origin main
