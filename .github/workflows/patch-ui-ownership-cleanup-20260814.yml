name: Patch UI ownership cleanup 2026-08-14
on:
  push:
    paths:
      - "scripts/patch_ui_ownership_cleanup_20260814.py"
      - ".github/workflows/patch-ui-ownership-cleanup-20260814.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_ui_ownership_cleanup_20260814.py
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: node --check tampermonkey/US-Sign-Design-Job-Tools.user.js
      - run: node --check tampermonkey/US-Sign-Menu-Cleanup.user.js
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- \
            tampermonkey/US-Sign-Full-UI-Theme.user.js \
            tampermonkey/US-Sign-Design-Job-Tools.user.js \
            tampermonkey/US-Sign-Menu-Cleanup.user.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tampermonkey/US-Sign-Full-UI-Theme.user.js \
            tampermonkey/US-Sign-Design-Job-Tools.user.js \
            tampermonkey/US-Sign-Menu-Cleanup.user.js
          git commit -m "Clean UI ownership boundaries"
          git push
