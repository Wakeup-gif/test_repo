name: Patch ChatGPT Glass Theme v2.0.6 wallpaper rotation
on:
  push:
    paths:
      - "scripts/patch_chatgpt_glass_v206.py"
      - ".github/workflows/patch-chatgpt-glass-v206.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python scripts/patch_chatgpt_glass_v206.py
      - name: Verify version
        run: |
          grep -q "@version      2.0.6" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify fresh cache generation
        run: |
          grep -q "chatgpt-us-sign-bing-wallpaper-pool-v3" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify minimum rotation pool
        run: |
          grep -q "MIN_ROTATION_POOL = 2" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify focus resync
        run: |
          grep -q 'window.addEventListener("focus", syncWallpaperRotation' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q 'visibilitychange' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q 'pageshow' tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Verify 30 minute rotation
        run: |
          grep -q "const ROTATE_MS = 30 \* 60 \* 1000" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve Bing UHD
        run: |
          grep -q "uhdwidth=3840&uhdheight=2160" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Preserve current glass stack
        run: |
          grep -q "body::before" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          grep -q "blur(22px) saturate(122%)" tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Syntax check
        run: |
          node --check tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
      - name: Diff check
        run: |
          git diff --check
      - name: Commit canonical update
        run: |
          if git diff --quiet -- tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js; then
            echo "No canonical theme changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/ChatGPT-US-Sign-Glass-Theme.user.js
          git commit -m "Fix ChatGPT Bing wallpaper rotation in v2.0.6"
          git push origin HEAD:main
