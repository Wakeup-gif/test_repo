name: Patch canvas v2.1.4
on:
  push:
    paths:
      - ".github/workflows/patch-canvas-v214.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rebuild_full_ui_from_restore_v210.py
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git diff --cached --quiet && exit 0
          git commit -m "Correct SquareCoil canvas wallpaper cascade v2.1.4"
          git push
