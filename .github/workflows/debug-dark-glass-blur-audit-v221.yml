name: Debug Dark Glass blur audit v2.2.1
on:
  push:
    paths:
      - ".github/workflows/debug-dark-glass-blur-audit-v221.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture patcher result
        shell: bash
        run: |
          set +e
          {
            echo "=== patcher ==="
            python scripts/patch_dark_glass_blur_audit_v221.py
            rc=$?
            echo "patcher_rc=$rc"
            echo "=== git status ==="
            git status --short
            echo "=== syntax ==="
            for f in \
              tampermonkey/US-Sign-Full-UI-Theme.user.js \
              tampermonkey/US-Sign-Design-Job-Tools.user.js \
              tampermonkey/US-Sign-Project-Scope-Workspace.user.js \
              tampermonkey/US-Sign-Description-File-Path-Tools.user.js \
              tampermonkey/US-Sign-Scope-of-Work-File-Tools.user.js \
              tampermonkey/US-Sign-UI-Runtime-Fixes.user.js; do
              echo "-- $f"
              node --check "$f" || true
            done
            echo "=== diff check ==="
            git diff --check || true
          } > /tmp/dark-glass-blur-audit-debug.txt 2>&1
      - name: Commit diagnostic only
        run: |
          git reset --hard HEAD
          git clean -fd
          cp /tmp/dark-glass-blur-audit-debug.txt dark-glass-blur-audit-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark-glass-blur-audit-debug.txt
          git commit -m "Capture Dark Glass blur audit diagnostic"
          git pull --rebase origin main
          git push origin main
