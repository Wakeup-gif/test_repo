name: Patch glass polish v2.1.5

on:
  push:
    paths:
      - "scripts/patch_full_ui_glass_polish_v215.py"
      - ".github/workflows/patch-glass-polish-v215.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply glass polish
        run: python scripts/patch_full_ui_glass_polish_v215.py
      - name: Validate userscript syntax
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Check diff
        run: git diff --check
      - name: Commit polished theme
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Polish SquareCoil glass surfaces v2.1.5"
          git push
