name: Patch Acrobat comments colors only

on:
  push:
    paths:
      - "scripts/patch_acrobat_comments_colors_only.py"
      - ".github/workflows/patch-acrobat-comments-colors-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Acrobat comments colors only
        run: python scripts/patch_acrobat_comments_colors_only.py
      - name: Validate JavaScript syntax
        run: node --check tampermonkey/Adobe-Acrobat-US-Sign-Colors.user.js
      - name: Check diff
        run: git diff --check
      - name: Commit patched Acrobat theme
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/Adobe-Acrobat-US-Sign-Colors.user.js; then
            echo "No Acrobat theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/Adobe-Acrobat-US-Sign-Colors.user.js
          git commit -m "Refine Acrobat comments to colors-only v1.2.0"
          git push
