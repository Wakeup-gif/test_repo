name: Patch Full UI horizontal offset v2.0.6

on:
  push:
    paths:
      - "scripts/patch_full_ui_horizontal_offset_v206.py"
      - ".github/workflows/patch-full-ui-horizontal-offset-v206.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Full UI Theme v2.0.6
        run: python scripts/patch_full_ui_horizontal_offset_v206.py
      - name: Validate JavaScript syntax
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Check diff
        run: git diff --check
      - name: Commit updated Full UI Theme
        shell: bash
        run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No Full UI Theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Fix SquareCoil project horizontal offset v2.0.6"
          git push
