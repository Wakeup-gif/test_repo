name: Patch Full UI v2.1.46
on:
  push:
    paths:
      - "scripts/patch_full_ui_v2146.py"
      - ".github/workflows/patch-full-ui-v2146.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Full UI v2.1.46
        run: python scripts/patch_full_ui_v2146.py
      - name: Verify
        run: |
          grep -q '@version      2.1.46' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'v2.1.46 SIDEBAR BACKDROP SOURCE FIX' tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -q 'html body #main::before' tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
          node --check tampermonkey/US-Sign-Full-UI-Theme-v2.1.46.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js tampermonkey/US-Sign-Full-UI-Theme-v2.1.46.user.js
          git commit -m "Fix sidebar shared wallpaper backdrop source v2.1.46"
          git pull --rebase origin main
          git push origin main
