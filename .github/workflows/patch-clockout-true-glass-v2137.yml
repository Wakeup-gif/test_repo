name: Patch Clock Out true glass v2.1.37
on:
  push:
    paths:
      - "scripts/patch_clockout_true_glass_v2137.py"
      - ".github/workflows/patch-clockout-true-glass-v2137.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Clock Out true glass patch
        run: python scripts/patch_clockout_true_glass_v2137.py
      - name: Verify true glass architecture
        run: |
          grep -Fq "@version      2.1.37" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "backdrop-filter: blur(14px) saturate(108%) brightness(0.80)" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "background-color: rgba(8, 18, 29, 0.16)" tampermonkey/US-Sign-Full-UI-Theme.user.js
          grep -Fq "Keeping the" tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Syntax check
        run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - name: Diff check
        run: git diff --check
      - name: Commit canonical update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Make Clock Out true transparent glass"
          git pull --rebase origin main
          git push origin HEAD:main
