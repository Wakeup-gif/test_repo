name: Patch Full UI Theme v2.1.25 glass blur restore
on:
  push:
    paths:
      - "scripts/patch_glass_blur_restore_v2125.py"
      - ".github/workflows/patch-glass-blur-restore-v2125.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_glass_blur_restore_v2125.py
      - run: 'grep -q "@version      2.1.25" tampermonkey/US-Sign-Full-UI-Theme.user.js'
      - run: 'grep -q "v2.1.25 VISIBLE GLASS BLUR RESTORE" tampermonkey/US-Sign-Full-UI-Theme.user.js'
      - run: 'grep -q "backdrop-filter: blur(14px) saturate(132%)" tampermonkey/US-Sign-Full-UI-Theme.user.js'
      - run: 'grep -q "backdrop-filter: blur(11px) saturate(126%)" tampermonkey/US-Sign-Full-UI-Theme.user.js'
      - run: node --check tampermonkey/US-Sign-Full-UI-Theme.user.js
      - run: git diff --check
      - run: |
          if git diff --quiet -- tampermonkey/US-Sign-Full-UI-Theme.user.js; then
            echo "No theme changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/US-Sign-Full-UI-Theme.user.js
          git commit -m "Restore frosted glass blur in Full UI v2.1.25"
          git push
