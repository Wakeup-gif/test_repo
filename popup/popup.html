<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SquareCoil Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">US</div>
      <div>
        <h1>SquareCoil Companion</h1>
        <p>Job timer widget</p>
      </div>
    </header>

    <section>
      <h2>Job Timer Appearance</h2>
      <div class="modes" role="radiogroup" aria-label="Job Timer Appearance">
        <button type="button" class="mode" data-theme="light" role="radio" aria-checked="false">
          <span class="swatch light"></span>
          <span><b>Light</b><small>Bright timer widget</small></span>
        </button>
        <button type="button" class="mode" data-theme="dark" role="radio" aria-checked="false">
          <span class="swatch dark"></span>
          <span><b>Dark</b><small>Sleek timer widget</small></span>
        </button>
        <button type="button" class="mode" data-theme="auto" role="radio" aria-checked="false">
          <span class="swatch auto"></span>
          <span><b>Auto</b><small>Follow system</small></span>
        </button>
      </div>
    </section>

    <section class="updates">
      <h2>Extension</h2>
      <div class="version-card">
        <div class="version-row"><span>Installed</span><b id="installedVersion">v0.3.0</b></div>
        <div class="version-row"><span>Latest published</span><b id="latestVersion">Checking…</b></div>
        <p id="updateMessage">Checking update channel…</p>
        <p id="releaseNotes" class="release-notes" hidden></p>
        <button type="button" id="checkUpdate" class="check-update">Check for update</button>
      </div>
    </section>

    <footer>
      <span class="dot"></span>
      <span id="status">Ready</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
